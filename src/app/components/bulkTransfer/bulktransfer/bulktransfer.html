<form [formGroup]="bulkTransferForm" (ngSubmit)="onSubmit()">

    <!-- Top-level field -->
    <div class="form-group">
        <label>From Account</label>
        <input type="text" formControlName="fromAccount">
    </div>
    <!-- FormArray directive — connects to the 'transfers' FormArray -->
    <div formArrayName="transfers">

        <!-- Loop over each FormGroup in the array -->
        <div *ngFor="let transfer of transfers.controls; let i = index;trackBy: trackByTxn" [formGroupName]="i"
            class="transfer-row">

            <h4>Transfer {{ i + 1 }}</h4>

            <!-- Each field uses formControlName — relative to [formGroupName]="i" -->
            <div class="form-group">
                <label>Beneficiary Name</label>
                <input type="text" formControlName="beneficiaryName">
                <div *ngIf="getControl(i, 'beneficiaryName')?.invalid && getControl(i, 'beneficiaryName')?.touched">
                    <span *ngIf="getControl(i, 'beneficiaryName')?.errors?.['required']">Name is required.</span>
                    <span *ngIf="getControl(i, 'beneficiaryName')?.errors?.['isSpecialChar']">No special
                        characters.</span>
                </div>
            </div>

            <div class="form-group">
                <label>Account Number</label>
                <input type="text" formControlName="accountNumber">
                <div *ngIf="getControl(i, 'accountNumber')?.invalid && getControl(i, 'accountNumber')?.touched">
                    <span *ngIf="getControl(i, 'accountNumber')?.errors?.['required']">Account number required.</span>
                    <span *ngIf="getControl(i, 'accountNumber')?.errors?.['pattern']">Must be 9-18 digits.</span>
                </div>
            </div>

            <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" formControlName="amount">
                <div *ngIf="getControl(i, 'amount')?.invalid && getControl(i, 'amount')?.touched">
                    <span *ngIf="getControl(i, 'amount')?.errors?.['min']">Minimum ₹1 required.</span>
                    <span *ngIf="getControl(i, 'amount')?.errors?.['max']">Maximum ₹10,00,000 allowed.</span>
                </div>
            </div>

            <div class="form-group">
                <label>IFSC Code</label>
                <input type="text" formControlName="ifscCode">
                <div *ngIf="getControl(i, 'ifscCode')?.invalid && getControl(i, 'ifscCode')?.touched">
                    <span *ngIf="getControl(i, 'ifscCode')?.errors?.['invalidIfsc']">Invalid IFSC format.</span>
                </div>
            </div>

            <div class="form-group">
                <label>Transfer Type</label>
                <select formControlName="transferType" (change)="onTransferTypeChange(i)">
                    <option value="NEFT">NEFT</option>
                    <option value="IMPS">IMPS</option>
                    <option value="RTGS">RTGS</option>
                </select>
            </div>

            <!-- Remove button — disabled if only 1 row remains -->
            <button type="button" (click)="removeTransfer(i)" [disabled]="transfers.length === 1">
                ❌ Remove
            </button>

        </div>
    </div>

    <!-- Summary -->
    <div class="transfer-summary">
        <p>Total Transfers: {{ transfers.length }}</p>
        <p>Total Amount: {{ totalAmount | currency:'INR':'symbol':'1.0-0' }}</p>
    </div>

    <!-- Add row button -->
    <button type="button" (click)="addTransfer()">➕ Add Beneficiary</button>

    <!-- Submit -->
    <button type="submit" [disabled]="bulkTransferForm.invalid">
        Submit All Transfers
    </button>

</form>
